# P1 change 1: FLAP calibrated on in-domain text = questions (+ options, NO answers) from the pool's TRAIN split.
# Everything else is identical to configs/p1_flap.yaml (same nsamples, seqlen, seed, metric, structure).
# Plans are tagged "flaptask_<ratio>" so they never overwrite the WikiText-calibrated "flap_<ratio>" plans.
phase: p1
run_name: flap_taskcal
seed: 0
require_gpu: false

paths:
  results_root: ${QACR_RESULTS_ROOT}
  plans_export: ${QACR_PLANS_DIR}

pool_path: data/p2/query_pool.parquet
flap_tag: flaptask
include_unpruned: false

base:
  path: HuggingFaceTB/SmolLM2-1.7B
  dtype: float16

calibration:
  source: pool_train
  nsamples: 1024
  seqlen: 128
  seed: 0

ppl:
  batch_size: 16

flap_ratios: [0.1, 0.2, 0.35, 0.5]

baselines:
  methods: []
  ratios: []

profile:
  prompt_lens: [128, 512, 1024]
  gen_tokens: 64
  warmup: 3
  reps: 5
